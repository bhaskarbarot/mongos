server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── API routes: proxy to FastAPI backend ─────────────────────────────────
    # Matches all routes the React app calls via fetch()
    location ~ ^/(health|chat|sources|feedback|cache|transcribe) {
        proxy_pass            http://backend:8000;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Allow slow AI responses (complex agent can take up to 3 min)
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback: all other routes serve index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff|woff2|ttf)$ {
        expires      1y;
        add_header   Cache-Control "public, immutable";
        access_log   off;
    }

    # Disable access log for health checks
    location = /health {
        proxy_pass http://backend:8000;
        access_log off;
    }
}
