<svg width="260" height="200" viewBox="0 0 260 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main terracotta gradient matching Claude theme -->
    <linearGradient id="grad1" x1="20" y1="10" x2="120" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#E8A882"/>
      <stop offset="50%"  stop-color="#CC785C"/>
      <stop offset="100%" stop-color="#9A4A2E"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E8916C"/>
      <stop offset="100%" stop-color="#CC5C3A"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ ICON (centred at 88,82) ═══════════════════════════════════════════ -->

  <!-- Outer large crescent arc — sweeps from lower-left, up and over the top -->
  <!-- Opens to the right, like the reference image -->
  <path d="M 38 115
           A 62 62 0 1 1 38 48"
        stroke="url(#grad1)" stroke-width="9" stroke-linecap="round" fill="none"
        filter="url(#glow)"/>

  <!-- Circuit dots on outer arc -->
  <circle cx="30" cy="81"  r="3.5" fill="#E8916C" opacity="0.90"/>
  <circle cx="36" cy="57"  r="2.5" fill="#CC785C" opacity="0.75"/>
  <circle cx="36" cy="106" r="2.5" fill="#CC785C" opacity="0.75"/>

  <!-- Inner ring arc — tighter, same orientation -->
  <path d="M 54 107
           A 40 40 0 1 1 54 56"
        stroke="url(#grad2)" stroke-width="5.5" stroke-linecap="round" fill="none"
        opacity="0.80"/>

  <!-- Inner partial arc (bottom-right curve) -->
  <path d="M 88 122 A 40 40 0 0 0 128 82"
        stroke="#CC785C" stroke-width="3.5" stroke-linecap="round" fill="none"
        opacity="0.45"/>

  <!-- Arrow / chevron pointing up-right — the central mark -->
  <g filter="url(#softglow)">
    <!-- Arrow shaft -->
    <line x1="72" y1="96" x2="104" y2="64"
          stroke="url(#grad1)" stroke-width="8" stroke-linecap="round"/>
    <!-- Arrow head top-right -->
    <polyline points="86,58 106,62 102,82"
              stroke="url(#grad1)" stroke-width="7" stroke-linejoin="round"
              stroke-linecap="round" fill="none"/>
  </g>

  <!-- Small glow circle at arrow tip -->
  <circle cx="105" cy="63" r="5" fill="#E8916C" opacity="0.50"/>

  <!-- ═══ TEXT ══════════════════════════════════════════════════════════════ -->

  <!-- ELSNER — bold, prominent -->
  <text x="148" y="72"
        font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="800" letter-spacing="2"
        fill="url(#grad1)">ELSNER</text>

  <!-- Analytica AI — lighter weight -->
  <text x="150" y="100"
        font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif"
        font-size="19" font-weight="500" letter-spacing="0.5"
        fill="#CC785C" opacity="0.88">Analytica AI</text>

  <!-- Thin separator line under text -->
  <line x1="148" y1="110" x2="252" y2="110"
        stroke="#CC785C" stroke-width="1.2" opacity="0.25"/>
</svg>
